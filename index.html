<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Hotel Security Management System</title>
<style>
:root{--navy:#10243a;--blue:#1d4668;--bg:#f2f5f8;--line:#e1e7ed;--muted:#718096}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:#172b3d}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:var(--navy);color:white;padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{padding:6px 10px 18px;border-bottom:1px solid #ffffff25}.brand b{display:block;letter-spacing:.5px}.brand small{color:#b9c9d8}.navlabel{font-size:10px;color:#91a8bc;letter-spacing:1px}nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#dce7f0;text-align:left;padding:11px;border-radius:8px;cursor:pointer}nav button.active,nav button:hover{background:#ffffff1b;color:#fff}.foot{margin-top:auto;color:#91a8bc;font-size:11px}.main{min-width:0}.top{height:64px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.top small{color:var(--muted)}.content{padding:25px;max-width:1400px;margin:auto}h1{font-size:23px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted);margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 2px 8px #10243a08}.metric small{color:var(--muted)}.metric b{display:block;font-size:27px;margin:8px 0}.metric em{font-size:11px;color:#18845b;font-style:normal}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:18px}.sect{font-weight:bold;margin:22px 0 10px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.item:last-child{border:0}.pill{font-size:10px;padding:4px 9px;border-radius:20px;background:#e8f5ee;color:#16734e}.warn{background:#fff5df;color:#946200}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}input,select,.btn{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:white;font-size:12px;color:#172b3d}.btn{cursor:pointer}.primary{background:var(--blue);color:white;border-color:var(--blue)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);background:#fafbfd}.notice{margin-top:15px;padding:12px;background:#fff8e8;border:1px solid #f4dfb4;border-radius:8px;color:#795b1a;font-size:12px;line-height:1.6}.actions{display:flex;gap:7px;flex-wrap:wrap}.report{display:flex;justify-content:space-between;align-items:center;gap:12px}.report p{font-size:12px;color:var(--muted);margin:5px 0 0}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:12px;gap:10px}.brand{padding:4px 8px 10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:9px}.navlabel,.foot{display:none}.content{padding:16px}.top{padding:0 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.metric{padding:12px}.metric b{font-size:22px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><b>HOTEL SECURITY</b><small>MANAGEMENT SYSTEM</small></div><div class="navlabel">MAIN MENU</div><nav id="nav"><button class="active" data-page="dashboard">▦ ภาพรวม Dashboard</button><button data-page="contractor">♙ Contractor Registration</button><button data-page="permit">▤ Work Permit</button><button data-page="patrol">⌖ Security Patrol</button><button data-page="logbook">▣ Security Logbook</button><button data-page="emergency">⚠ Emergency Case</button><button data-page="incident">▧ Incident Report</button><button data-page="cctv">◉ CCTV Operations Center</button><button data-page="reports">▤ Report Center</button></nav><div class="foot">Prototype v0.1 · Demo data only</div></aside><main class="main"><header class="top"><b id="crumb">ภาพรวม Dashboard</b><small>SECURITY DEPARTMENT | PROTOTYPE</small></header><section class="content" id="view"></section></main></div>
<script>
const names={dashboard:'ภาพรวม Dashboard',contractor:'Contractor Registration',permit:'Work Permit',patrol:'Security Patrol',logbook:'Security Logbook',emergency:'Emergency Case',incident:'Incident Report',cctv:'CCTV Operations Center',reports:'Report Center'};
const data={contractor:{h:['เวลาเข้า','ชื่อผู้รับเหมา','บริษัท','แผนก','ทีม','สถานะ'],r:[['08:15','สมชาย ใจดี','ABC Engineering','Engineering','4','ออกแล้ว'],['08:35','วิชัย พรหมมา','Bright Cleaning','Housekeeping','6','ยังอยู่']]},permit:{h:['WP Number','ประเภทงาน','บริษัท','สถานะ'],r:[['WP-261120-ELE01','Electrical','ABC Engineering','Approved'],['WP-261120-HT03','Working at Height','Safe Tech','Pending']]},patrol:{h:['รอบตรวจ','ผู้ตรวจ','จุดตรวจ','ผลการตรวจ'],r:[['10:00','SEC002','6','5 Normal / 1 Abnormal'],['14:00','SEC001','6','6 Normal']]},logbook:{h:['เวลา','ผู้บันทึก','รายละเอียด','สถานะ'],r:[['07:45','SEC001','ตรวจสอบประตูทางเข้า','ปกติ'],['10:15','SEC002','แจ้งรถจอดกีดขวาง','ติดตาม']]},emergency:{h:['Case ID','ประเภทเหตุ','สถานที่','สถานะ'],r:[['EC-261120-001','Medical Assistance','Lobby','Follow-up'],['EC-261120-002','Smoke Observation','Kitchen','Closed']]},incident:{h:['Incident ID','ประเภทเหตุ','สถานที่','สถานะ'],r:[['IR-261120-001','Slip and Fall','Public Area','Under Review'],['IR-261120-002','Property Damage','Parking','Recorded']]}};
const metric=(a,b,c)=>'<div class="card metric"><small>'+a+'</small><b>'+b+'</b><em>'+c+'</em></div>';
const actions=s=>'<div class="actions"><button class="btn" onclick="pdf(\''+s+'\',\'Summary\')">Summary PDF</button><button class="btn primary" onclick="pdf(\''+s+'\',\'Full\')">Full PDF</button></div>';
function page(k){let v=document.getElementById('view');document.getElementById('crumb').textContent=names[k];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===k));
if(k==='dashboard'){v.innerHTML='<h1>Security Operations Overview</h1><div class="sub">Daily overview · 20 November 2026</div><div class="grid">'+metric('Contractors','28','64 team members')+metric('Work Permits','8','5 approved')+metric('Patrol Checkpoints','24','4 patrol rounds')+metric('Open Cases','2','Requires follow-up')+'</div><div class="two"><div><div class="sect">ระบบปฏิบัติงาน</div><div class="card">'+['Contractor Registration','Work Permit','Security Patrol','Security Logbook'].map(x=>'<div class="item"><b>'+x+'</b><span class="pill">Demo</span></div>').join('')+'</div></div><div><div class="sect">รายการติดตาม</div><div class="card"><div class="item">WP-261120-HT03 · Working at Height <span class="pill warn">Pending</span></div><div class="item">EC-261120-001 · Medical Assistance <span class="pill warn">Follow-up</span></div><div class="item">IR-261120-003 · Property Damage <span class="pill">Review</span></div></div></div></div><div class="notice">ข้อมูลทั้งหมดเป็นข้อมูลจำลอง ยังไม่ได้เชื่อม Supabase หรือระบบเดิม</div>';return}
if(k==='cctv'){v.innerHTML='<h1>'+names[k]+'</h1><div class="sub">ศูนย์ควบคุมกล้องวงจรปิด</div><div class="grid">'+metric('Camera Channels','—','รอเชื่อมต่อกล้อง')+metric('Online','—','ยังไม่มีข้อมูลจริง')+metric('Offline','—','ยังไม่มีข้อมูลจริง')+metric('Alerts','—','รอระบบแจ้งเตือน')+'</div><div class="card" style="margin-top:15px;text-align:center;padding:45px"><div style="font-size:40px">◉</div><b>CCTV connection pending</b><p>พื้นที่แสดงภาพกล้องจะเปิดใช้งานเมื่อเชื่อมต่อ CCTV จริง</p></div>';return}
if(k==='reports'){v.innerHTML='<h1>Report Center</h1><div class="sub">ศูนย์รวมรายงาน Security · เลือกวันที่และรูปแบบ PDF</div><div class="toolbar"><label>วันที่รายงาน</label><input type="date" value="2026-11-20"><button class="btn">Apply</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+['Contractor Registration','Work Permit','Security Patrol','Security Logbook','Emergency Case','Incident Report','Daily Security Summary'].map(x=>'<div class="card report"><div><b>'+x+'</b><p>20 November 2026 · PDF</p></div>'+actions(x)+'</div>').join('')+'</div><div class="notice">Full PDF ของระบบเดิมต้องเชื่อมแหล่งข้อมูลและรูปแบบเอกสารต้นฉบับก่อน เพื่อให้รายละเอียดและรูปภาพครบถ้วน</div>';return}
let d=data[k],rows=d.r.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');v.innerHTML='<h1>'+names[k]+'</h1><div class="sub">รายการตัวอย่างประจำวันที่ 20 November 2026</div><div class="toolbar"><input type="date" value="2026-11-20"><select><option>ทั้งหมด</option><option>ปกติ</option><option>รอติดตาม</option></select><button class="btn" onclick="alert(\'Prototype: ยังไม่เชื่อมฐานข้อมูล\')">ค้นหา</button></div><div class="card tablewrap"><table><thead><tr>'+d.h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div><div class="sect">รายงาน PDF</div><div class="card report"><div><b>'+names[k]+'</b><p>เลือกรายงานสรุปหรือรายละเอียดฉบับเต็ม</p></div>'+actions(names[k])+'</div><div class="notice">ข้อมูลจำลองเท่านั้น การเชื่อมข้อมูลจริงและการดาวน์โหลด PDF จะทำในขั้นตอนถัดไป</div>'}
function pdf(s,t){alert(t+' PDF · '+s+'\nPrototype เท่านั้น: ยังไม่เชื่อมระบบสร้าง/ดาวน์โหลด PDF จริง')}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)page(b.dataset.page)});page('dashboard');
</script></body></html>
